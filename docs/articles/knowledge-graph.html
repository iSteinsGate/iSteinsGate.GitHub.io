            padding: 20px;

            color: #64b5f6;
        }

            background: rgba(255, 255, 255, 0.1);
            color: #fff;

            margin-bottom: 15px;

            margin-bottom: 20px;
        }
        
        .category-btn {

            cursor: pointer;
            transition: all 0.3s;

            padding: 20px;
            display: none;

        .detail-panel.active {

        }
        
        .detail-header {
            margin-bottom: 20px;
        }
        
        .detail-header h3 {
            font-size: 20px;
            color: #64b5f6;
            margin-bottom: 10px;
        }
        
        .detail-meta {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .detail-section {
            margin-top: 20px;
        }
        
        .detail-section h4 {
            font-size: 14px;
            color: #81c784;
            margin-bottom: 10px;
        }
        
        .keyword-tag {

            padding: 3px 10px;
            margin: 3px;
            background: rgba(129, 199, 132, 0.2);
            border-radius: 12px;
            font-size: 12px;

        .related-list {

        .related-item {
            padding: 8px 12px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.05);

            cursor: pointer;
            font-size: 13px;
        }
        
        .related-item:hover {
            background: rgba(100, 181, 246, 0.2);
        }
        
        /* 图例 */
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
        }
        
        .legend-title {
            font-size: 12px;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .legend-item {

        .legend-dot {

            margin: 8px 0;

        }
        
        .stats-value {

            font-weight: 600;
        }

</head>

        // 颜色配置
        const categoryColors = {
            'AI': '#64b5f6',
            'Java': '#81c784',
            'Linux': '#ffb74d',
            '其他': '#ce93d8'
        };
        
        // 画布相关
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let nodes = [];
        let edges = [];
        let selectedNode = null;
        let hoveredNode = null;
        let draggedNode = null;
        let offsetX, offsetY;
        let activeCategory = 'all';
        
        // 初始化
        function init() {
            resizeCanvas();
            initNodes();
            initEdges();
            initUI();
            draw();
            
            window.addEventListener('resize', () => {
                resizeCanvas();
                draw();
            });
            
            canvas.addEventListener('mousedown', onMouseDown);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('click', onClick);
        }
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        
        function initNodes() {
            const padding = 100;
            nodes = graphData.nodes.map((node, i) => ({
                ...node,
                x: padding + Math.random() * (width - 2 * padding),
                y: padding + Math.random() * (height - 2 * padding),
                radius: 20 + (getNodeEdges(node.id).length * 3),
                color: categoryColors[node.category] || '#999'
            }));
        }
        
        function initEdges() {
            edges = graphData.edges.map(edge => ({
                ...edge,
                sourceNode: nodes.find(n => n.id === edge.source),
                targetNode: nodes.find(n => n.id === edge.target)
            }));
        }
        
        function initUI() {
            // 更新统计
            document.getElementById('totalNodes').textContent = graphData.nodes.length;
            document.getElementById('totalEdges').textContent = graphData.edges.length;
            document.getElementById('totalCategories').textContent = Object.keys(categoryColors).length;
            
            // 生成分类按钮
            const filterContainer = document.getElementById('categoryFilter');
            Object.keys(categoryColors).forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                btn.dataset.category = cat;
                btn.textContent = cat;
                btn.onclick = () => filterCategory(cat);
                filterContainer.appendChild(btn);
            });
            
            // 生成图例
            const legendContainer = document.getElementById('legendItems');
            Object.entries(categoryColors).forEach(([cat, color]) => {
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = `<div class="legend-dot" style="background: ${color}"></div>${cat}`;
                legendContainer.appendChild(item);
            });
            
            // 生成节点列表
            updateNodeList();
            
            // 搜索功能
            document.getElementById('searchInput').addEventListener('input', (e) => {
                updateNodeList(e.target.value);
            });
        }
        
        function updateNodeList(search = '') {
            const list = document.getElementById('nodeList');
            list.innerHTML = '';
            
            const filteredNodes = nodes.filter(node => {
                const matchCategory = activeCategory === 'all' || node.category === activeCategory;
                const matchSearch = search === '' || 
                    (node.label || node.id || '').toLowerCase().includes(search.toLowerCase()) ||
                    (node.keywords || []).some(k => k.toLowerCase().includes(search.toLowerCase()));
                return matchCategory && matchSearch;
            });
            
            filteredNodes.forEach(node => {
                const li = document.createElement('li');
                li.className = `node-item ${selectedNode?.id === node.id ? 'selected' : ''}`;
                const title = node.label || node.id || '未命名';
                const keywords = node.keywords || [];
                li.innerHTML = `
                    <div class="title">${title}</div>
                    <div class="category">${node.category || '未分类'} · ${keywords.slice(0, 3).join(', ')}</div>
                `;
                li.onclick = () => selectNode(node);
                list.appendChild(li);
            });
        }
        
        function getNodeEdges(nodeId) {
            return edges.filter(e => e.source === nodeId || e.target === nodeId);
        }
        
        function getRelatedNodes(nodeId) {
            const related = new Set();
            edges.forEach(edge => {
                if (edge.source === nodeId) related.add(edge.target);
                if (edge.target === nodeId) related.add(edge.source);
            });
            return Array.from(related);
        }
        
        function filterCategory(category) {
            activeCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === category);
            });
            updateNodeList(document.getElementById('searchInput').value);
            draw();
        }
        
        function selectNode(node) {
            selectedNode = node;
            updateNodeList(document.getElementById('searchInput').value);
            updateDetailPanel(node);
            draw();
        }
        
        function updateDetailPanel(node) {
            const panel = document.getElementById('detailPanel');
            panel.classList.add('active');
            
            const title = node.label || node.id || '未命名';
            const path = node.path || '';
            const keywords = node.keywords || [];
            
            document.getElementById('detailTitle').textContent = title;
            document.getElementById('detailMeta').textContent = `${node.category || '未分类'} · ${path}`;
            
            document.getElementById('detailKeywords').innerHTML = keywords
                .map(k => `<span class="keyword-tag">${k}</span>`)
                .join('');
            
            const related = getRelatedNodes(node.id);
            document.getElementById('relatedList').innerHTML = related
                .map(id => {
                    const n = nodes.find(x => x.id === id);
                    if (!n) return '';
                    const relatedTitle = n.label || n.id || '未命名';
                    return `<li class="related-item" onclick="selectNode(nodes.find(x => x.id === '${id}'))">${relatedTitle}</li>`;
                })
                .filter(html => html)
                .join('');
        }
        
        function openArticle() {
            if (selectedNode && selectedNode.path) {
                window.open('../' + selectedNode.path, '_blank');
            }
        }
        
        // 绘制
        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // 绘制边
            edges.forEach(edge => {
                if (!edge.sourceNode || !edge.targetNode) return;
                
                const isVisible = activeCategory === 'all' || 
                    edge.sourceNode.category === activeCategory || 
                    edge.targetNode.category === activeCategory;
                
                if (!isVisible) return;
                
                const isHighlighted = selectedNode && 
                    (edge.source === selectedNode.id || edge.target === selectedNode.id);
                
                ctx.beginPath();
                ctx.moveTo(edge.sourceNode.x, edge.sourceNode.y);
                ctx.lineTo(edge.targetNode.x, edge.targetNode.y);
                ctx.strokeStyle = isHighlighted ? 
                    'rgba(100, 181, 246, 0.8)' : 
                    'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = isHighlighted ? 2 : 1;
                ctx.stroke();
            });
            
            // 绘制节点
            nodes.forEach(node => {
                const isVisible = activeCategory === 'all' || node.category === activeCategory;
                if (!isVisible) return;
                
                const isSelected = selectedNode?.id === node.id;
                const isHovered = hoveredNode?.id === node.id;
                const isRelated = selectedNode && getRelatedNodes(selectedNode.id).includes(node.id);
                
                // 节点光晕
                if (isSelected || isHovered) {
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, node.radius + 10, 0, Math.PI * 2);
                    ctx.fillStyle = `${node.color}33`;
                    ctx.fill();
                }
                
                // 节点主体
                ctx.beginPath();
                ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
                ctx.fillStyle = isSelected ? node.color : 
                    isRelated ? `${node.color}cc` : 
                    `${node.color}88`;
                ctx.fill();
                
                // 节点边框
                ctx.strokeStyle = isSelected ? '#fff' : node.color;
                ctx.lineWidth = isSelected ? 3 : 1;
                ctx.stroke();
                
                // 节点标签
                ctx.fillStyle = '#fff';
                ctx.font = `${isSelected ? 'bold ' : ''}12px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // 截断过长的标题
                let label = node.label || node.id || '?';
                if (label.length > 8) {
                    label = label.substring(0, 8) + '...';
                }
                ctx.fillText(label, node.x, node.y);
            });
        }
        
        // 交互
        function getNodeAt(x, y) {
            return nodes.find(node => {
                const isVisible = activeCategory === 'all' || node.category === activeCategory;
                if (!isVisible) return false;
                
                const dx = x - node.x;
                const dy = y - node.y;
                return Math.sqrt(dx * dx + dy * dy) < node.radius;
            });
        }
        
        function onMouseDown(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            draggedNode = getNodeAt(x, y);
            if (draggedNode) {
                offsetX = x - draggedNode.x;
                offsetY = y - draggedNode.y;
            }
        }
        
        function onMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (draggedNode) {
                draggedNode.x = x - offsetX;
                draggedNode.y = y - offsetY;
                draw();
            } else {
                const node = getNodeAt(x, y);
                canvas.style.cursor = node ? 'pointer' : 'default';
                hoveredNode = node;
                draw();
            }
        }
        
        function onMouseUp() {
            draggedNode = null;
        }
        
        function onClick(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const node = getNodeAt(x, y);
            if (node) {
                selectNode(node);
            }
        }
        
        // 启动
        init();
    </script>
</body>
</html>
